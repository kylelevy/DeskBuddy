[project]
name = "deskbuddy-client"
version = "2.0.0"
description = "A lightweight Python client for the DeskBuddy ESP32 firmware HTTP API."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "DeskBuddy contributors" }]
dependencies = [
  "httpx>=0.27.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deskbuddy_client"]
