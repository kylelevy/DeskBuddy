[project]
name = "yeti-firmware-client"
version = "0.1.0"
description = "A typed, object-oriented Python client for the YETI ESP32 firmware HTTP API."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "YETI contributors" }]
dependencies = [
  "httpx>=0.27.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yeti_client"]
